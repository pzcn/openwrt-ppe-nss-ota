name: Hybrid Builder - pinned kernel/PPE preflight (no compilation)

on:
  workflow_dispatch:
  push:
    branches: [feat/hybrid-official-snapshot]
    paths:
      - ".github/workflows/hybrid-kernel-preflight.yml"
      - "scripts/prepare-hybrid-kernel.sh"
      - "scripts/configure-hybrid-kernel.sh"
      - "scripts/port-ppe-nss-to-immortalwrt.sh"
      - "config/hybrid-kernel-re-ss-01.config"

permissions:
  contents: read

concurrency:
  group: re-ss-01-hybrid-kernel-preflight
  cancel-in-progress: false

jobs:
  port:
    name: Pinned source and PPE/NSS port compatibility check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python and Bash
        run: |
          python3 -m py_compile scripts/resolve-immortalwrt-snapshot.py
          python3 scripts/tests/test-hybrid-snapshot.py
          bash -n scripts/prepare-hybrid-kernel.sh scripts/port-ppe-nss-to-immortalwrt.sh scripts/configure-hybrid-kernel.sh
      - name: Install light source-preflight dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq rsync
      - name: Resolve pinned official Snapshot
        run: |
          python3 scripts/resolve-immortalwrt-snapshot.py --output out-snapshot/snapshot-lock.json
      - name: Check PPE/NSS port against the exact official source revision
        id: port
        run: |
          bash scripts/prepare-hybrid-kernel.sh out-snapshot/snapshot-lock.json
      - name: Validate feed-pinned Kconfig without compiling
        run: |
          bash scripts/configure-hybrid-kernel.sh out-snapshot/snapshot-lock.json
      - name: Report checked sources
        if: success()
        run: |
          {
            echo "## Hybrid Builder P2 source-port preflight"
            echo "No kernel or firmware compiled. No release published."
            echo ""
            echo "Snapshot: $(jq -r .snapshot out-hybrid-kernel-preflight/hybrid-kernel-preflight.json)"
            echo ""
            echo "Official SHA: $(jq -r .immortalwrt_commit out-hybrid-kernel-preflight/hybrid-kernel-preflight.json)"
            echo ""
            echo "PPE SHA: $(jq -r .ppe_nss_commit out-hybrid-kernel-preflight/hybrid-kernel-preflight.json)"
            echo ""
            echo "Next: verified official compiler, selective kernel/kmod compilation, ABI checks."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immortalwrt-hybrid-kernel-preflight
          path: |
            out-snapshot/snapshot-lock.json
            out-hybrid-kernel-preflight/
          if-no-files-found: warn
          retention-days: 14

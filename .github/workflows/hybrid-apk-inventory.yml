name: Hybrid Builder - official APK reuse inventory (test only)

on:
  workflow_dispatch:
  push:
    branches: [feat/hybrid-official-snapshot]
    paths:
      - ".github/workflows/hybrid-apk-inventory.yml"
      - "scripts/hybrid-official-apk-plan.py"
      - "scripts/tests/test-hybrid-apk-plan.py"

permissions:
  contents: read

concurrency:
  group: re-ss-01-hybrid-apk-inventory
  cancel-in-progress: true

jobs:
  inventory:
    name: Pin official userland APK candidates without using official kmods
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate offline inventory and download invariants
        run: |
          python3 -m py_compile scripts/hybrid-official-apk-plan.py
          python3 scripts/tests/test-hybrid-apk-plan.py
          python3 scripts/tests/test-hybrid-snapshot.py
      - name: Resolve official target and arch checksums
        run: |
          python3 scripts/resolve-immortalwrt-snapshot.py --output out-snapshot/snapshot-lock.json
      - name: Inventory userland APK reuse against both pinned repositories
        run: |
          python3 scripts/hybrid-official-apk-plan.py             --lock out-snapshot/snapshot-lock.json             --output out-hybrid-apk/package-inventory.json
      - name: Verify a small real official APK by pinned checksum
        run: |
          # Test actual downloader without mirroring large packages or kmods.
          PKG="$(jq -r '[.packages[] | select(.status == "official-candidate") |
                 select(.name == "jsonfilter" or .name == "etherwake" or .name == "flock")
                 ][0].name // empty' out-hybrid-apk/package-inventory.json)"
          if [ -z "$PKG" ]; then
            echo "::error::Expected small official userland package not found; inspect inventory."
            exit 1
          fi
          echo "Downloading verified userland candidate: $PKG"
          python3 scripts/hybrid-official-apk-plan.py             --lock out-snapshot/snapshot-lock.json             --output out-hybrid-apk/package-inventory.json             --download "$PKG" --download-dir out-hybrid-apk/apks
      - name: Report inventory coverage
        if: always()
        run: |
          if [ -f out-hybrid-apk/package-inventory.json ]; then
            {
              echo "## Hybrid Builder P3 official APK reuse inventory"
              echo "No kernel modules or firmware produced; no dependency closure yet."
              echo ""
              jq -r '.packages | group_by(.status) | .[] |
                "- " + .[0].status + ": " + (length | tostring)'                 out-hybrid-apk/package-inventory.json
              echo ""
              echo "Download manifest is SHA256-bound to official Snapshot lock."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload inventory and sample userland APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-hybrid-official-apk-sample
          path: |
            out-snapshot/snapshot-lock.json
            out-hybrid-apk/
          retention-days: 14
          if-no-files-found: warn

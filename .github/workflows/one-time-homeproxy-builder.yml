name: One-time build newly selected ImmortalWrt packages
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-homeproxy-builder.yml
permissions:
  actions: write
  contents: write
jobs:
  dispatch-and-cleanup:
    if: github.repository == 'pzcn/openwrt-ppe-nss-ota'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Manually dispatch the existing full Builder once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run builder-immortalwrt.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched full source Builder for HomeProxy and official apps" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete merged feature branch and this temporary dispatcher
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          branch="feat/immortalwrt-official-luci-apps"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
          fi
          git config user.name "Peizhe Zhang"
          git config user.email "sdustpedro@gmail.com"
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/one-time-homeproxy-builder.yml
          git commit -s -m "chore: remove one-time official apps Builder dispatch workflow"
          git push origin HEAD:main

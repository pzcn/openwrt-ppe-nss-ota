name: Publish verified MX4200 native OTA fix once

# Publish the already-built MX4200 firmware only; no ImageBuilder or kernel build.
# Runs for the specific firmware job that followed PR #33 merging.
on:
  workflow_run:
    workflows:
      - Firmware - Arthur and MX4200 (reuse published Builders)
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.id == 43702663568 && github.event.workflow_run.head_sha == '29bf5d47efb2268501287d931f872b983d50eac1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 29bf5d47efb2268501287d931f872b983d50eac1
      BUILDER_TAG: mx4200-builder-9246a1f31f0b9401dbd44e11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mx4200v1-firmware
          run-id: 43702663568
          github-token: ${{ github.token }}
          path: out-mx4200v1-fast-repack
      - name: Confirm native OTA UI and immutable Builder provenance
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq jq
          jq -e --arg source "$SOURCE_SHA" --arg builder "$BUILDER_TAG" '
            .repack_source_commit == $source and
            .parent_builder_tag == $builder and
            .compiled_kernel == false and .reused_imagebuilder == true
          ' out-mx4200v1-fast-repack/repack-metadata.json
          jq -e --arg source "$SOURCE_SHA" '.source_commit == $source' \
            out-mx4200v1-fast-repack/mx4200v1-ota-identity.json
          MX_VERIFY_ONLY=true bash mx4200v1/publish-release.sh firmware out-mx4200v1-fast-repack
      - name: Publish MX4200 prerelease without recompiling
        env:
          GITHUB_SHA: 29bf5d47efb2268501287d931f872b983d50eac1
        run: bash mx4200v1/publish-release.sh firmware out-mx4200v1-fast-repack

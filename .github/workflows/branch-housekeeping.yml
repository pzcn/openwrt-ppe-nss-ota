name: One-time ImmortalWrt branch archive and cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/branch-housekeeping.yml']
permissions:
  contents: write
jobs:
  housekeeping:
    if: github.repository == 'pzcn/openwrt-ppe-nss-ota'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Archive original branch tips and remove obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          repo="$GITHUB_REPOSITORY"
          branches=(
            build/immortalwrt-no-patch-no-f2fs
            experiment/immortalwrt-sysupgrade-save-ab
            feat/immortalwrt-reusable-imagebuilder
            feature/immortalwrt-ppe-nss
            fix/immortalwrt-remove-extra-f2fs
            test/immortalwrt-f2fs-tools-ab
            upstream/re-ss-01-f2fs-20261109
            chore/immortalwrt-only-consolidation
          )
          # First archive ALL extant branch heads; any failure stops before deletion.
          for branch in "${branches[@]}"; do
            if ! sha="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)"; then
              echo "Already absent: $branch"
              continue
            fi
            tag="archive/20261109/$branch"
            if ! gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" >/dev/null
            fi
            archived="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
            test "$archived" = "$sha" || { echo "Archive ref mismatch for $branch" >&2; exit 1; }
            echo "Archived $branch as $tag ($sha)"
          done
          # Both dependent development PRs were closed after integration into main.
          for branch in "${branches[@]}"; do
            if gh api "repos/$repo/git/ref/heads/$branch" >/dev/null 2>&1; then
              tag="archive/20261109/$branch"
              gh api "repos/$repo/git/ref/tags/$tag" >/dev/null
              gh api --method DELETE "repos/$repo/git/refs/heads/$branch" >/dev/null
              echo "Removed archived branch: $branch"
            fi
          done
      - name: Remove this temporary housekeeping workflow
        run: |
          set -Eeuo pipefail
          git config user.name "Peizhe Zhang"
          git config user.email "sdustpedro@gmail.com"
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/branch-housekeeping.yml
          git commit -s -m "chore: remove temporary branch housekeeping workflow"
          git push origin HEAD:main

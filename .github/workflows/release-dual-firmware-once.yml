name: Publish MX4200 v1 verified firmware (retry release only)

# Reuse completed images from the successful build. No new Builder or repack.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-dual-firmware-once.yml

permissions:
  contents: write
  actions: read

jobs:
  release-mx4200v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mx4200v1-fast-repacked-firmware-test
          run-id: 43699585527
          github-token: ${{ github.token }}
          path: out-mx4200v1-fast-repack
      - name: Install verification dependency
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq jq
      - name: Verify MX4200 images, sysupgrade metadata, and SHA256
        run: MX_VERIFY_ONLY=true bash mx4200v1/publish-release.sh firmware out-mx4200v1-fast-repack
      - name: Publish only the already-built MX4200 prerelease
        env:
          GITHUB_SHA: "30543538d969decb5bd4b8f6ca3e691428eba58f"
        run: bash mx4200v1/publish-release.sh firmware out-mx4200v1-fast-repack

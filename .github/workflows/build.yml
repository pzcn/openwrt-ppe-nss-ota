name: Build RE-SS-01 firmware

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Optional upstream PPE+NSS release tag; blank = latest"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "config/**"
      - "files/**"
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

concurrency:
  group: re-ss-01-release-credential-fix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_TAG: ${{ inputs.upstream_tag || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd rsync python3 file jq curl
          chmod +x scripts/build.sh

      - name: Test LuCI Chinese catalogs (offline)
        run: python3 scripts/tests/test-luci-i18n.py

      - name: Verify native LuCI pages and persisted URLs (offline)
        run: python3 scripts/tests/test-luci-native.py

      - name: Test saved LuCI checkbox states (mock DOM)
        run: node scripts/tests/test-luci-autocheckboxes.js

      - name: Test compact PPE / NSS dashboard (mock DOM)
        run: node scripts/tests/test-ppe-nss-monitor.js

      - name: Validate Dr.COM URLs using the native ucode interpreter
        run: |
          sudo apt-get install -y libjson-c-dev pkg-config cmake
          git clone --quiet --depth 1 https://github.com/ucode-lang/ucode.git "$RUNNER_TEMP/ucode-src"
          git -C "$RUNNER_TEMP/ucode-src" fetch --quiet --depth 1 origin a2c42eac6369a0bba0315007c7dc7b7130275340
          git -C "$RUNNER_TEMP/ucode-src" checkout --quiet a2c42eac6369a0bba0315007c7dc7b7130275340
          cmake -S "$RUNNER_TEMP/ucode-src" -B "$RUNNER_TEMP/ucode-build" \
            -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF \
            -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build "$RUNNER_TEMP/ucode-build" --parallel 2 --target ucode
          python3 scripts/tests/test-drcom-ucode.py "$RUNNER_TEMP/ucode-build/ucode"

      - name: Test Dr.COM RPC URL saving (mock UCI)
        run: node scripts/tests/test-drcom-rpc.js

      - name: Test Dr.COM login and logout (local mock portal)
        run: python3 scripts/tests/test-drcom.py

      - name: Verify Tailscale and Wake on LAN integration (offline)
        run: python3 scripts/tests/test-extra-apps.py

      - name: Test custom OTA (offline, no flash)
        run: bash scripts/tests/test-custom-ota.sh

      - name: Build sysupgrade image and publish GitHub Release
        run: bash scripts/build.sh

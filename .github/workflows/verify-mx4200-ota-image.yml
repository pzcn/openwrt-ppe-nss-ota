name: Verify MX4200 OTA shortcut inside repacked SquashFS

on:
  push:
    branches: [fix/mx4200-luci-ota-visibility]
    paths:
      - .github/workflows/verify-mx4200-ota-image.yml
      - files/**
      - mx4200v1/repack-hybrid.sh
      - scripts/tests/test-luci-native.py
      - scripts/tests/test-ota-devices.py

permissions:
  contents: read

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BUILDER_TAG: mx4200-builder-9246a1f31f0b9401dbd44e11
      BASE_SOURCE_SHA: 915c3dff6a5b10b041fc6c630c7753609e9dbcee
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate shared LuCI and OTA contracts
        run: |
          set -Eeuo pipefail
          node --check files/www/luci-static/resources/view/system/flash.js
          python3 scripts/tests/test-luci-native.py
          python3 scripts/tests/test-ota-devices.py
          python3 mx4200v1/test_fast_repack.py
      - name: Install pure ImageBuilder dependencies, no compiler
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            jq zstd rsync make file python3 gawk squashfs-tools
      - name: Download MX4200 Builder and its immutable checksums
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/mx4200-parent/"{builder,firmware,diagnostics}
          gh release download "$BASE_BUILDER_TAG" -R "$GITHUB_REPOSITORY" \
            -D "$RUNNER_TEMP/mx4200-parent/builder" \
            -p '*imagebuilder*.tar.zst' -p base-overlay.tar.gz -p snapshot-lock.json
          gh release download "$BASE_BUILDER_TAG" -R "$GITHUB_REPOSITORY" \
            -D "$RUNNER_TEMP/mx4200-parent/firmware" -p sha256sums
          gh release download "$BASE_BUILDER_TAG" -R "$GITHUB_REPOSITORY" \
            -D "$RUNNER_TEMP/mx4200-parent/diagnostics" \
            -p mx4200v1-hybrid-metadata.json -p local-apks.txt
      - name: Repack firmware and verify OTA shortcut in final SquashFS
        run: |
          bash mx4200v1/repack-hybrid.sh \
            "$RUNNER_TEMP/mx4200-parent/builder" \
            "$RUNNER_TEMP/mx4200-parent/firmware" \
            "$RUNNER_TEMP/mx4200-parent/diagnostics"
      - name: Upload verified firmware for test
        uses: actions/upload-artifact@v4
        with:
          name: mx4200v1-custom-ota-verified
          path: out-mx4200v1-fast-repack/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

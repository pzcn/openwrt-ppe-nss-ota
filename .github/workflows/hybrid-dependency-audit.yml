name: Hybrid Builder - audit official APK dependency graph (test only)

on:
  workflow_dispatch:
  push:
    branches: [feat/hybrid-official-snapshot]
    paths:
      - ".github/workflows/hybrid-dependency-audit.yml"
      - "scripts/hybrid-dependency-audit.py"
      - "scripts/tests/test-hybrid-dependency-audit.py"

permissions:
  contents: read

jobs:
  audit:
    name: Read pinned APK indexes and audit transitive dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Run offline regression tests
        run: |
          python3 -m py_compile scripts/hybrid-dependency-audit.py
          python3 scripts/tests/test-hybrid-dependency-audit.py
          python3 scripts/tests/test-hybrid-apk-plan.py
      - name: Install required extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd jq
      - name: Resolve official Snapshot and inventory requested packages
        run: |
          python3 scripts/resolve-immortalwrt-snapshot.py --output out-snapshot/snapshot-lock.json
          python3 scripts/hybrid-official-apk-plan.py \
            --lock out-snapshot/snapshot-lock.json \
            --output out-hybrid-deps/package-inventory.json
      - name: Get verified official apk-tools from pinned ImageBuilder
        run: |
          bash scripts/inspect-hybrid-official-ib.sh out-snapshot/snapshot-lock.json
      - name: Download and verify all six official binary APK indexes
        shell: bash
        run: |
          set -Eeuo pipefail
          LOCK="$GITHUB_WORKSPACE/out-snapshot/snapshot-lock.json"
          mkdir -p out-hybrid-deps/indexes
          IB_ROOT="$RUNNER_TEMP/hybrid-ib-inspect/extracted"
          APK="$(find "$IB_ROOT" -type f -path '*/staging_dir/host/bin/apk' -print -quit)"
          [[ -n "$APK" && -x "$APK" ]] || exit 1
          for feed in target base packages luci routing telephony; do
            if [[ "$feed" == target ]]; then
              name="$(jq -er '.package_indexes.target.filename' "$LOCK")"
              hash="$(jq -er '.package_indexes.target.sha256' "$LOCK")"
              url="$(jq -er '.target_url' "$LOCK")/$name"
            else
              name="$(jq -er --arg f "$feed" '.package_indexes.architecture[$f].filename' "$LOCK")"
              hash="$(jq -er --arg f "$feed" '.package_indexes.architecture[$f].sha256' "$LOCK")"
              url="$(jq -er '.architecture_url' "$LOCK")/$name"
            fi
            [[ "$name" == packages/packages.adb || "$name" == "$feed/packages.adb" ]] || exit 1
            [[ "$hash" =~ ^[a-f0-9]{64}$ ]] || exit 1
            curl -fsSL --retry 3 --max-time 90 "$url" -o "$RUNNER_TEMP/$feed.packages.adb"
            echo "$hash  $RUNNER_TEMP/$feed.packages.adb" | sha256sum -c --status
            "$APK" adbdump "$RUNNER_TEMP/$feed.packages.adb" > "out-hybrid-deps/indexes/$feed.txt"
            echo "$feed: $(wc -l < "out-hybrid-deps/indexes/$feed.txt") metadata lines"
          done
      - name: Analyze requested package transitive dependencies
        run: |
          python3 scripts/hybrid-dependency-audit.py \
            --inventory out-hybrid-deps/package-inventory.json \
            --index-dir out-hybrid-deps/indexes \
            --output out-hybrid-deps/dependency-audit.json
      - name: Report remaining ABI and solver blockers
        if: success()
        run: |
          jq -r '
            "## P3 - dependency audit (not a completed APK solver)\n" +
            "\nOfficial root candidates: " + (.requested_official_packages | tostring) +
            "\nCandidate transitive packages: " + (.candidate_closure_size | tostring) +
            "\nRequires local ABI artifacts: " + (.requires_local_provision | length | tostring) +
            "\nMissing dependencies: " + (.unresolved | length | tostring) +
            "\nAmbiguous providers: " + (.ambiguous | length | tostring) +
            "\nVersion constraints for real solver: " + (.version_constraints_for_apk_solver | length | tostring) +
            "\n\nPublishable: NO (kernel ABI, signatures and apk solver not yet validated)."
          ' out-hybrid-deps/dependency-audit.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reproducible audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-hybrid-dependency-audit
          path: |
            out-snapshot/snapshot-lock.json
            out-hybrid-deps/package-inventory.json
            out-hybrid-deps/dependency-audit.json
          if-no-files-found: warn
          retention-days: 14

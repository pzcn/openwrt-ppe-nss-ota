name: Hybrid Builder - official SDK compatibility inventory (test only)

on:
  workflow_dispatch:
  push:
    branches: [feat/hybrid-official-snapshot]
    paths:
      - ".github/workflows/hybrid-sdk-inspect.yml"
      - "scripts/inspect-hybrid-official-sdk.sh"

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect frozen SDK host tools and official-only kernel symbols
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install archive and index utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd jq
      - name: Verify script and pin official target Snapshot
        run: |
          bash -n scripts/inspect-hybrid-official-sdk.sh
          python3 scripts/resolve-immortalwrt-snapshot.py \
            --output out-snapshot/snapshot-lock.json
      - name: Download and inspect the official matched SDK
        run: |
          bash scripts/inspect-hybrid-official-sdk.sh \
            out-snapshot/snapshot-lock.json
      - name: Record future SDK reuse feasibility (not ABI approval)
        if: always()
        run: |
          if [ -f out-hybrid-sdk-inspect/sdk-inspection.json ]; then
            {
              echo "## Hybrid official SDK feasibility"
              jq -r '"Host tools: " + (.host_bin_executables|tostring) +
                "\nHost stamps: " + (.host_stamps|tostring) +
                "\nOfficial kernel symbols: " + (.official_kernel_symbols|tostring)' \
                out-hybrid-sdk-inspect/sdk-inspection.json
              echo "Official SDK Module.symvers is NOT reusable for the patched NSS kernel."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload SDK inventory (no official kernel artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-hybrid-official-sdk-inspection
          path: |
            out-snapshot/snapshot-lock.json
            out-hybrid-sdk-inspect/
          retention-days: 14
          if-no-files-found: warn

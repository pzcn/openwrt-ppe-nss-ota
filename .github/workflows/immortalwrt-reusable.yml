name: ImmortalWrt NSS reusable ImageBuilder and firmware

on:
  workflow_dispatch:
    inputs:
      force_core:
        description: "Recompile kernel/NSS even if the matching ImageBuilder exists"
        required: false
        type: boolean
        default: false
      publish_release:
        description: "Publish independent ImmortalWrt ImageBuilder / OTA releases"
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/immortalwrt-reusable.yml"
      - "scripts/**"
      - "config/**"
      - "files/**"
      - "docs/IMMORTALWRT-PPE-NSS.md"
  schedule:
    # Check upstream once a day; no build when all versions already match.
    - cron: "41 3 * * *"

permissions:
  contents: write

concurrency:
  group: immortalwrt-reusable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH_RELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
    steps:
      - name: Checkout custom firmware
        uses: actions/checkout@v4

      - name: Resolve source commits and existing builder
        id: resolve
        env:
          FORCE_CORE: ${{ inputs.force_core || false }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          IMM_SHA="$(git ls-remote https://github.com/immortalwrt/immortalwrt.git refs/heads/master | cut -f1)"
          PPE_SHA="$(git ls-remote https://github.com/JuliusBairaktaris/openwrt-ppe-nss.git refs/heads/ppe-nss | cut -f1)"
          BASE_SHA="$(git ls-remote https://github.com/JuliusBairaktaris/Qualcommax_NSS_Builder.git refs/heads/main | cut -f1)"
          for sha in "$IMM_SHA" "$PPE_SHA" "$BASE_SHA"; do
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          done
          TAG="$(python3 scripts/immortalwrt_builder.py tag \
            --immortal "$IMM_SHA" --ppe "$PPE_SHA" --base "$BASE_SHA")"
          echo "builder_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "upstream_immortal=$IMM_SHA" >> "$GITHUB_OUTPUT"
          echo "upstream_ppe=$PPE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$FORCE_CORE" == true ]] || \
             ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "needs_core=true" >> "$GITHUB_OUTPUT"
            echo "needs_image=true" >> "$GITHUB_OUTPUT"
            echo "Core ImageBuilder missing/changed; full source build required."
            exit 0
          fi
          echo "needs_core=false" >> "$GITHUB_OUTPUT"
          IMAGE_KEY="imm-ppe-nss-${IMM_SHA:0:8}-${PPE_SHA:0:8}-g$(git rev-parse --short=8 HEAD)-"
          if [[ "$EVENT_NAME" == schedule ]] && \
             gh release list --repo "$GITHUB_REPOSITORY" -L 100 --json tagName \
               --jq '.[].tagName' | grep -Fq "$IMAGE_KEY"; then
            echo "needs_image=false" >> "$GITHUB_OUTPUT"
            echo "Everything is current; no build needed."
          else
            echo "needs_image=true" >> "$GITHUB_OUTPUT"
            echo "Reusing existing verified ImageBuilder."
          fi

      - name: Install lightweight repacking tools
        if: steps.resolve.outputs.needs_core == 'false' && steps.resolve.outputs.needs_image == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd rsync jq python3 make

      - name: Download matching ImageBuilder and package repository
        if: steps.resolve.outputs.needs_core == 'false' && steps.resolve.outputs.needs_image == 'true'
        env:
          BUILDER_TAG: ${{ steps.resolve.outputs.builder_tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/imm-builder-download"
          gh release download "$BUILDER_TAG" --repo "$GITHUB_REPOSITORY" \
            -D "$RUNNER_TEMP/imm-builder-download" \
            -p '*imagebuilder*.tar.zst' -p 'base-overlay.tar.gz' \
            -p 'imagebuilder-packages.txt' -p 'builder-metadata.json'
          find "$RUNNER_TEMP/imm-builder-download" -maxdepth 1 -type f -printf '%f\n'

      - name: Fast firmware build with existing ImageBuilder
        if: steps.resolve.outputs.needs_core == 'false' && steps.resolve.outputs.needs_image == 'true'
        run: |
          set -Eeuo pipefail
          DIR="$RUNNER_TEMP/imm-builder-download"
          ARCHIVE="$(find "$DIR" -maxdepth 1 -type f -name '*imagebuilder*.tar.zst' -print -quit)"
          test -n "$ARCHIVE"
          BUILDER_META="$DIR/builder-metadata.json" \
          BUILDER_ARCHIVE="$ARCHIVE" \
          BASE_OVERLAY="$DIR/base-overlay.tar.gz" \
          BUILDER_PACKAGES="$DIR/imagebuilder-packages.txt" \
            bash scripts/repack-immortalwrt.sh

      - name: Free disk space for kernel/NSS compilation
        if: steps.resolve.outputs.needs_core == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install full source build prerequisites
        if: steps.resolve.outputs.needs_core == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison bzip2 ccache clang cmake cpio curl device-tree-compiler \
            file flex gawk gettext git gperf haveged help2man intltool jq \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libreadline-dev libssl-dev libtool \
            ninja-build p7zip-full patch pkgconf python3 python3-pip \
            python3-ply python3-pyelftools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo unzip wget xmlto xxd \
            zlib1g-dev zstd

      - name: Setup dashboard build tooling
        if: steps.resolve.outputs.needs_core == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate source customization
        if: steps.resolve.outputs.needs_core == 'true'
        run: |
          python3 scripts/tests/test-luci-i18n.py
          python3 scripts/tests/test-luci-native.py
          node scripts/tests/test-luci-autocheckboxes.js
          node scripts/tests/test-ppe-nss-monitor.js
          python3 scripts/tests/test-extra-apps.py
          bash scripts/tests/test-custom-ota.sh
          python3 scripts/tests/test-immortalwrt-ota.py
          python3 scripts/tests/test-immortalwrt-builder.py

      - name: Compile new kernel/NSS and standalone ImageBuilder
        if: steps.resolve.outputs.needs_core == 'true'
        run: bash scripts/build-immortalwrt.sh

      - name: Upload generated firmware or builder artifacts
        if: steps.resolve.outputs.needs_image == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-imagebuilder-and-firmware
          path: out-immortal/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

name: One-time remove merged weekly Builder branch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-weekly-builder-branch.yml']
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'pzcn/openwrt-ppe-nss-ota'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Delete merged development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          branch="ci/weekly-or-manual-builder"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
          fi
      - name: Remove one-time workflow from main
        run: |
          set -Eeuo pipefail
          git config user.name "Peizhe Zhang"
          git config user.email "sdustpedro@gmail.com"
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/cleanup-weekly-builder-branch.yml
          git commit -s -m "chore: remove temporary weekly Builder cleanup workflow"
          git push origin HEAD:main

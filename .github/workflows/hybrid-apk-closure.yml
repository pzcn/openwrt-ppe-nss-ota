name: Hybrid Builder - native APK recursive closure (test only)

on:
  workflow_dispatch:
  push:
    branches: [feat/hybrid-official-snapshot]
    paths:
      - ".github/workflows/hybrid-apk-closure.yml"
      - "scripts/fetch-hybrid-apk-closure.sh"
      - "scripts/hybrid-verify-apk-closure.py"
      - "scripts/tests/test-hybrid-apk-closure.py"

permissions:
  contents: read

concurrency:
  group: re-ss-01-hybrid-apk-closure
  cancel-in-progress: true

jobs:
  fetch-closure:
    name: Resolve and checksum-verify a real official userspace closure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Run offline safety and provenance checks
        run: |
          bash -n scripts/inspect-hybrid-official-ib.sh scripts/fetch-hybrid-apk-closure.sh
          python3 scripts/tests/test-hybrid-snapshot.py
          python3 scripts/tests/test-hybrid-apk-plan.py
          python3 scripts/tests/test-hybrid-apk-closure.py
      - name: Install official ImageBuilder unpack utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd jq
      - name: Lock official target and arch repositories
        run: |
          python3 scripts/resolve-immortalwrt-snapshot.py             --output out-snapshot/snapshot-lock.json
      - name: Fetch and inspect official ImageBuilder with apk 3 solver
        run: |
          bash scripts/inspect-hybrid-official-ib.sh out-snapshot/snapshot-lock.json
      - name: Recursively fetch a real official package and its dependencies
        run: |
          bash scripts/fetch-hybrid-apk-closure.sh             out-snapshot/snapshot-lock.json out-hybrid-closure etherwake
      - name: Report verified dependencies
        if: always()
        run: |
          if [ -f out-hybrid-closure/closure-manifest.json ]; then
            {
              echo "## Hybrid P3 APK recursive closure"
              echo "Native apk-tools 3.0 solver; official signatures and SHA256 checks."
              echo "No foreign kmods or patched packages allowed."
              echo "Full kernel/userspace ABI and firmware closure still unverified."
              echo ""
              jq -r '"Fetched packages: " + (.count|tostring)'                 out-hybrid-closure/closure-manifest.json
              jq -r '.files[] | "- " + .name + " (" + .source + "/" + .feed + ")"'                 out-hybrid-closure/closure-manifest.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sample closure and audit metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-hybrid-apk-closure-experiment
          path: |
            out-snapshot/snapshot-lock.json
            out-hybrid-closure/
            out-hybrid-ib-inspect/apk-version.txt
          retention-days: 14
          if-no-files-found: warn

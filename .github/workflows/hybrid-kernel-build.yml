name: Hybrid Builder - selective kernel/NSS compilation (test only)

on:
  workflow_dispatch:
  push:
    branches: [feat/hybrid-official-snapshot]
    paths:
      - ".github/workflows/hybrid-kernel-build.yml"
      - "scripts/compile-hybrid-kernel.sh"
      - "scripts/hybrid-prefetch-host-sources.sh"

permissions:
  contents: read

concurrency:
  group: re-ss-01-hybrid-kernel-test
  cancel-in-progress: true

jobs:
  compile:
    name: Compile patched kernel and selected kmods with official toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Validate build scripts and offline lock tests
        run: |
          bash -n scripts/prepare-hybrid-kernel.sh             scripts/configure-hybrid-kernel.sh             scripts/compile-hybrid-kernel.sh             scripts/reuse-official-toolchain.sh             scripts/hybrid-prefetch-host-sources.sh
          python3 scripts/tests/test-hybrid-snapshot.py
      - name: Restore selected source archives
        uses: actions/cache/restore@v4
        with:
          path: .build-cache/dl
          key: hybrid-ipq60xx-dl-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hybrid-ipq60xx-dl-v1-${{ runner.os }}-
      - name: Restore compiler objects (no kernel trees)
        uses: actions/cache/restore@v4
        with:
          path: .build-cache/ccache
          key: hybrid-ipq60xx-ccache-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hybrid-ipq60xx-ccache-v1-${{ runner.os }}-
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h
      - name: Install required kernel build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq             build-essential ack antlr3 asciidoc autoconf automake autopoint             binutils bison bzip2 ccache clang cmake cpio curl device-tree-compiler             file flex gawk gettext git gperf haveged help2man intltool jq             libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev             libmpfr-dev libncurses-dev libreadline-dev libssl-dev libtool             ninja-build p7zip-full patch pkgconf python3 python3-pip             python3-ply python3-pyelftools rsync squashfs-tools subversion swig             texinfo unzip wget xmlto xxd zlib1g-dev zstd
      - name: Resolve official Snapshot and pin PPE/NSS source
        run: |
          python3 scripts/resolve-immortalwrt-snapshot.py             --output out-snapshot/snapshot-lock.json
          bash scripts/prepare-hybrid-kernel.sh out-snapshot/snapshot-lock.json
      - name: Restore pinned package feeds and verify minimal kernel config
        run: |
          bash scripts/configure-hybrid-kernel.sh out-snapshot/snapshot-lock.json
      - name: Compile only selected kernel and NSS packages
        id: compile
        run: |
          bash scripts/compile-hybrid-kernel.sh out-snapshot/snapshot-lock.json
      - name: Report compile phase durations
        if: always()
        run: |
          {
            echo "## Hybrid Builder P2 compile experiment"
            echo "Test only: this workflow DOES NOT publish a Builder or firmware."
            for f in out-hybrid-kernel-test/*.seconds; do
              if [ -f "$f" ]; then
                printf '%s: %s sec\n' "$(basename "$f" .seconds)" "$(cat "$f")"
              fi
            done
            echo ""
            echo "For full logs, inspect the workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      # Persist partial downloads/ccache even if host tools or kernel compilation
      # fail. actions/cache@v4 post-save is skipped on failed jobs; that made
      # every P2 diagnostic repeat an 8+ minute download step.
      - name: Save downloaded archives after failure or success
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .build-cache/dl
          key: hybrid-ipq60xx-dl-v1-${{ runner.os }}-${{ github.run_id }}
      - name: Save ccache objects after failure or success
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .build-cache/ccache
          key: hybrid-ipq60xx-ccache-v1-${{ runner.os }}-${{ github.run_id }}
      - name: Upload experiment logs and selection metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-hybrid-kernel-experiment
          path: |
            out-snapshot/snapshot-lock.json
            out-hybrid-kernel-preflight/
            out-hybrid-kernel-test/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0

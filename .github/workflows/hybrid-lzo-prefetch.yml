name: Hybrid Builder - verify host LZO mirror (test only)

on:
  workflow_dispatch:
  push:
    branches: [feat/hybrid-official-snapshot]
    paths:
      - ".github/workflows/hybrid-lzo-prefetch.yml"
      - "scripts/hybrid-prefetch-host-sources.sh"

permissions:
  contents: read

jobs:
  verify:
    name: Verify liblzo upstream mirror and pinned SHA256
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n scripts/hybrid-prefetch-host-sources.sh
      - name: Download LZO from public OpenWrt source mirror
        run: |
          bash scripts/hybrid-prefetch-host-sources.sh "$RUNNER_TEMP/hybrid-dl"
          sha256sum "$RUNNER_TEMP/hybrid-dl/lzo-2.10.tar.gz"
          bash scripts/hybrid-prefetch-host-sources.sh "$RUNNER_TEMP/hybrid-dl"
      - name: Summary
        run: |
          echo "LZO 2.10 source preseeded and SHA256 verified. No source compilation or firmware release." >> "$GITHUB_STEP_SUMMARY"

name: Build RE-SS-01 ImmortalWrt PPE+NSS

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a new independent ImmortalWrt release after compilation"
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - ".github/workflows/build-immortalwrt.yml"
      - "scripts/**"
      - "config/**"
      - "files/**"

permissions:
  contents: write

concurrency:
  group: immortal-ppe-nss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-build:
    name: Compile ImmortalWrt + PPE/NSS + custom firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || false }}
    steps:
      - name: Checkout custom overlay
        uses: actions/checkout@v4

      - name: Free build disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential ack antlr3 asciidoc autoconf automake autopoint             binutils bison bzip2 ccache clang cmake cpio curl device-tree-compiler             file flex gawk gettext git gperf haveged help2man intltool jq             libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev             libmpfr-dev libncurses-dev libreadline-dev libssl-dev libtool             ninja-build p7zip-full patch pkgconf python3 python3-pip             python3-ply python3-pyelftools qemu-utils rsync scons             squashfs-tools subversion swig texinfo unzip wget xmlto xxd             zlib1g-dev zstd

      - name: Set up Node.js for LuCI sing-box dashboard
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify existing custom LuCI components
        run: |
          python3 scripts/tests/test-luci-i18n.py
          python3 scripts/tests/test-luci-native.py
          node scripts/tests/test-luci-autocheckboxes.js
          node scripts/tests/test-ppe-nss-monitor.js
          python3 scripts/tests/test-extra-apps.py
          bash scripts/tests/test-custom-ota.sh
          python3 scripts/tests/test-immortalwrt-ota.py

      - name: Validate reusable ImageBuilder orchestration
        run: |
          bash -n scripts/build-immortalwrt.sh
          bash -n scripts/repack-immortalwrt.sh
          python3 scripts/tests/test-immortalwrt-builder.py

      - name: Build ImmortalWrt from source
        run: |
          bash scripts/build-immortalwrt.sh

      - name: Upload complete firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ppe-nss-re-ss-01
          path: out-immortal/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

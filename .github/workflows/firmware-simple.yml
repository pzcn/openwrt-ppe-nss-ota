name: Firmware - Arthur and MX4200 (reuse published Builders)

# Firmware never compiles a kernel, SDK or new Builder.
# Every device runs independently; a failure on one cannot rebuild the other.
on:
  workflow_dispatch:
    inputs:
      device:
        description: Device to repack
        type: choice
        options: [both, arthur, mx4200v1]
        default: both
      publish:
        description: Publish Arthur stable OTA and MX4200 test prerelease
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "config/add.txt"
      - "config/remove.txt"
      - "config/translations/**"
      - "files/**"
      - "mx4200v1/stage-overlay.sh"
      - "mx4200v1/ota-artifacts.sh"
      - "mx4200v1/repack-hybrid.sh"
      - "mx4200v1/packages.txt"
      - "mx4200v1/remove.txt"
      - "scripts/repack-immortalwrt.sh"
      - "scripts/immortalwrt_ota.py"
      - "scripts/ota_version.py"
      - "scripts/arthur_builder_resolver.py"
      - "config/arthur-builder-policy.json"
      - "scripts/stage-firmware-overlay.sh"
      - "scripts/stage-sing-box-pre.sh"
      - ".github/workflows/firmware-simple.yml"

permissions:
  contents: write

jobs:
  version:
    name: One shared OTA version/build timestamp
    runs-on: ubuntu-24.04
    outputs:
      epoch: ${{ steps.clock.outputs.epoch }}
    steps:
      - id: clock
        run: echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

  arthur:
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.device != 'mx4200v1'
    uses: ./.github/workflows/firmware-immortalwrt.yml
    with:
      builder_tag: ""
      layer_tag: ""
      force_firmware: false
      publish_release: false
      ota_build_epoch: ${{ needs.version.outputs.epoch }}
      publish_policy: ${{ ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-official-r-20261115]'))) && 'yes' || 'no' }}
    secrets: inherit

  mx4200v1:
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.device != 'arthur'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: mx4200v1-firmware
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      MX_OTA_BUILD: ${{ needs.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify OTA module URL changes with image build and content
        run: |
          python3 scripts/tests/test-luci-cache-identity.py
          python3 scripts/tests/test-ota-version.py
      - name: Verify native Backup/Flash OTA rendering
        run: node scripts/tests/test-embedded-ota-render.js
      - name: Validate GitHub proxy transport and LuCI settings
        run: |
          python3 scripts/tests/test-ota-github-proxy.py
          node scripts/tests/test-ota-proxy-ui.js
      - name: Check prerelease Builder and exact source compatibility
        id: builder
        run: python3 mx4200v1/resolve-release.py
      - name: Install ImageBuilder runtime
        if: steps.builder.outputs.available == 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends jq zstd rsync make file python3 gawk squashfs-tools
      - name: Download immutable Builder assets
        if: steps.builder.outputs.available == 'true'
        env:
          BUILDER_TAG: ${{ steps.builder.outputs.tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/mx4200-parent/"{builder,firmware,diagnostics}
          gh release download "$BUILDER_TAG" -D "$RUNNER_TEMP/mx4200-parent/builder" \
            -p '*imagebuilder*.tar.zst' -p base-overlay.tar.gz -p snapshot-lock.json
          gh release download "$BUILDER_TAG" -D "$RUNNER_TEMP/mx4200-parent/firmware" -p sha256sums
          gh release download "$BUILDER_TAG" -D "$RUNNER_TEMP/mx4200-parent/diagnostics" \
            -p mx4200v1-hybrid-metadata.json -p local-apks.txt
      - name: Repack MX4200 with no compilation
        if: steps.builder.outputs.available == 'true'
        env:
          BASE_BUILDER_TAG: ${{ steps.builder.outputs.tag }}
          BASE_SOURCE_SHA: ${{ steps.builder.outputs.source_commit }}
        run: |
          bash mx4200v1/repack-hybrid.sh \
            "$RUNNER_TEMP/mx4200-parent/builder" \
            "$RUNNER_TEMP/mx4200-parent/firmware" \
            "$RUNNER_TEMP/mx4200-parent/diagnostics"
      - name: Upload manually testable firmware
        if: steps.builder.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mx4200v1-firmware
          path: out-mx4200v1-fast-repack/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Publish verified MX4200 OTA on explicit release request
        if: >-
          steps.builder.outputs.available == 'true' &&
          ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
           (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-official-r-20261115]')))
        env:
          MX_RELEASE_STABLE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-official-r-20261115]') && 'true' || 'false' }}
          GITHUB_EVENT_RELEASE_MARKER: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-official-r-20261115]') && 'release-official-r-20261115' || '' }}
        run: bash mx4200v1/publish-release.sh firmware out-mx4200v1-fast-repack

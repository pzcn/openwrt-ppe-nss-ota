name: WMA301 | RAM boot recovery (initramfs)

# Separate full-source recovery build. Never releases OTA or flashes NAND.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wma301-ramboot.yml'
      - 'wma301/configs/ramboot.config'
      - 'wma301/configs/ramboot-packages.txt'
      - 'wma301/scripts/prepare.py'
      - 'wma301/scripts/prepare_ramboot.py'
      - 'wma301/scripts/verify_ramboot.py'
      - 'wma301/scripts/test_ramboot.py'
      - 'wma301/scripts/fit_inspect.py'
      - 'wma301/scripts/verify.py'
      - 'wma301/scripts/sync_package_config.py'
      - 'wma301/device/**'
      - 'wma301/files/etc/diag.sh'

permissions:
  contents: read

concurrency:
  group: wma301-ramboot-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: wma301

jobs:
  ramboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      DEBIAN_FRONTEND: noninteractive
      WMA301_ENABLE_OTA: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Check RAM recovery integration and FIT verifier
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare.py scripts/prepare_ramboot.py \
            scripts/verify_ramboot.py scripts/verify.py scripts/fit_inspect.py \
            scripts/sync_package_config.py
          python3 scripts/test_ramboot.py
          python3 scripts/test_sync_package_config.py

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Install full-source build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev python3 python3-pyelftools python3-setuptools rsync \
            swig unzip zlib1g-dev file wget curl xz-utils zstd

      - name: Clone ImmortalWrt master
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master \
            https://github.com/immortalwrt/immortalwrt.git upstream
          echo "UPSTREAM_SHA=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Integrate WMA301 and switch to RAM-only FIT
        run: |
          set -euo pipefail
          python3 scripts/prepare.py --upstream upstream
          python3 scripts/prepare_ramboot.py --upstream upstream
          cp configs/ramboot.config upstream/.config
          python3 scripts/sync_package_config.py apply \
            --packages configs/ramboot-packages.txt --config upstream/.config
          ! grep -q 'root=/dev/fit0' \
            upstream/target/linux/mediatek/dts/mt7981b-tplink-wma301-v2-common.dtsi
          ! sed -n '/# Local WMA301 OEM-layout integration/,$p' \
              upstream/target/linux/mediatek/image/filogic.mk | \
            grep -q 'IMAGE/sysupgrade.itb'

      - uses: actions/cache@v4
        with:
          path: wma301/upstream/dl
          key: wma301-ramboot-dl-${{ runner.os }}-${{ hashFiles('wma301/configs/ramboot.config', 'wma301/configs/ramboot-packages.txt') }}
          restore-keys: |
            wma301-ramboot-dl-${{ runner.os }}-

      - name: Configure and verify initramfs
        working-directory: wma301/upstream
        run: |
          set -euo pipefail
          # Only feeds required by this rescue image; avoid unrelated video Kconfig.
          ./scripts/feeds update packages luci routing
          ./scripts/feeds install -a -p packages
          ./scripts/feeds install -a -p luci
          ./scripts/feeds install -a -p routing
          make defconfig
          grep -qx 'CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config
          grep -Eq '^CONFIG_TARGET_.*wma301-v2=y$' .config
          python3 ../scripts/sync_package_config.py check \
            --packages ../configs/ramboot-packages.txt --config .config

      - name: Download sources
        working-directory: wma301/upstream
        run: |
          make download -j4 > ../ramboot-download.log 2>&1 || {
            tail -n 150 ../ramboot-download.log
            exit 1
          }

      - name: Compile RAM recovery FIT (full-source)
        working-directory: wma301/upstream
        run: |
          make -j2 > ../ramboot-build.log 2>&1 || {
            tail -n 220 ../ramboot-build.log
            exit 1
          }
          tail -n 35 ../ramboot-build.log

      - name: Validate RAM FIT, DTB and checksum
        run: |
          set -euo pipefail
          python3 scripts/verify_ramboot.py \
            --images upstream/bin/targets/mediatek/filogic \
            --output dist --upstream-sha "$UPSTREAM_SHA" \
            --local-sha "$GITHUB_SHA"
          (cd dist && sha256sum -c SHA256SUMS)
          test "$(find dist -maxdepth 1 -name '*recovery.itb' | wc -l)" -eq 1

      - name: Upload verified RAM-boot FIT (not an OTA release)
        uses: actions/upload-artifact@v4
        with:
          name: WMA301_RAMBOOT_INITRAMFS
          path: wma301/dist/
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        if: success()
        run: |
          {
            echo '## WMA301 RAM-boot recovery'
            echo '- Device: TP-Link WMA301 v2.0/v2.1, 256 MiB RAM'
            echo '- Image: `immortalwrt-mediatek-filogic-tplink_wma301-v2-initramfs-recovery.itb`'
            echo '- Boot: U-Boot TFTP `bootm`; **do not use sysupgrade**'
            echo '- Root: `/dev/ram0`; no UBI auto-attach and no persistent FIT image'
            echo '- Contents: wired LuCI, SSH, UBI/NAND troubleshooting'
            echo '- Verification: FIT hashes and DTB checked; physical boot NOT_TESTED'
          } >> "$GITHUB_STEP_SUMMARY"

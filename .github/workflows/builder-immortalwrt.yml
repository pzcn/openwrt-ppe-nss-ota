name: Build ImmortalWrt PPE/NSS Builder and matching SDK

on:
  # Always compile on either trigger. No upstream version preflight.
  workflow_dispatch:
  schedule:
    # Every Sunday at 05:43 UTC (13:43 China Standard Time).
    - cron: "43 5 * * 0"
permissions:
  contents: write

concurrency:
  group: re-ss-01-builder
  cancel-in-progress: false

jobs:
  build:
    name: Compile kernel, NSS, APKs, standalone Builder and SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore downloaded source archives
        uses: actions/cache@v4
        with:
          path: .build-cache/dl
          key: immortal-ipq60xx-downloads-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            immortal-ipq60xx-downloads-v1-${{ runner.os }}-
      - name: Restore compiler objects (ccache)
        uses: actions/cache@v4
        with:
          path: .build-cache/ccache
          key: immortal-ipq60xx-ccache-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            immortal-ipq60xx-ccache-v1-${{ runner.os }}-
      # Upstream Go uses tmp/go-build, which is lost with each ephemeral VM.
      - name: Restore Go compilation cache
        uses: actions/cache@v4
        with:
          path: .build-cache/go-build
          key: immortal-ipq60xx-go-v1-${{ runner.os }}-go1.27-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            immortal-ipq60xx-go-v1-${{ runner.os }}-go1.27-
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h
      - name: Install source compilation dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison bzip2 ccache clang cmake cpio curl device-tree-compiler \
            file flex gawk gettext git gperf haveged help2man intltool jq \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libreadline-dev libssl-dev libtool \
            ninja-build p7zip-full patch pkgconf python3 python3-pip \
            python3-ply python3-pyelftools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo unzip wget xmlto xxd \
            zlib1g-dev zstd
      - name: Setup dashboard dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Use official Go binary for the build bootstrap
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: Run core and package checks
        run: |
          python3 scripts/tests/test-extra-apps.py
          python3 scripts/tests/test-immortalwrt-ota.py
          python3 scripts/tests/test-immortalwrt-builder.py
          python3 scripts/tests/test-immortalwrt-sdk.py
          python3 scripts/tests/test-immortalwrt-compat.py
          python3 scripts/tests/test-luci-i18n.py
      - name: Build matching ImageBuilder and SDK with smoke tests
        env:
          PUBLISH_RELEASE: "false"
        run: bash scripts/build-immortalwrt.sh
      - name: Publish paired ImageBuilder and SDK, then trigger firmware
        shell: bash
        run: |
          set -Eeuo pipefail
          DIR="$GITHUB_WORKSPACE/out-immortal"
          META="$DIR/builder-metadata.json"
          SDK_META="$DIR/sdk-metadata.json"
          TAG="$(jq -er '.tag' "$META")"
          [[ "$TAG" == imm-builder-* ]] || { echo "::error::Invalid compiled Builder tag"; exit 1; }
          SDK_NAME="$(jq -er '.archive' "$SDK_META")"
          SDK_ARCHIVE="$DIR/$SDK_NAME"
          test -s "$SDK_ARCHIVE"
          jq -e --arg tag "$TAG" '.builder_tag == $tag and .target == "qualcommax/ipq60xx"' "$SDK_META" >/dev/null
          python3 scripts/immortalwrt_sdk.py verify \
            --metadata "$SDK_META" --builder-metadata "$META" \
            --archive "$SDK_ARCHIVE" --feed-lock "$DIR/sdk-feeds.lock.json"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Builder $TAG already exists; preserve immutable Release."
            # A build is complete only when the existing Release also has a
            # compatible SDK, never silently succeed with an SDK-less Builder.
            EXISTING="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for required in "$SDK_NAME" sdk-metadata.json sdk-feeds.lock.json; do
              if ! grep -Fxq "$required" <<< "$EXISTING"; then
                echo "::error::Existing Builder $TAG lacks matching SDK asset: $required" >&2
                exit 1
              fi
            done
          else
            ARCHIVE="$(find "$DIR" -maxdepth 1 -name '*imagebuilder*.tar.zst' -type f -print -quit)"
            test -s "$ARCHIVE"
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --latest=false \
              --title "ImmortalWrt PPE+NSS ImageBuilder + SDK ($TAG)" \
              --notes "ABI-matched standalone ImageBuilder and source-build SDK for JDCloud RE-SS-01 (qualcommax/ipq60xx). Use sdk-metadata.json and sdk-feeds.lock.json to verify and pin matching kernel, toolchain and feeds." \
              "$ARCHIVE" "$DIR/base-overlay.tar.gz" "$DIR/imagebuilder-packages.txt" \
              "$META" "$SDK_ARCHIVE" "$SDK_META" "$DIR/sdk-feeds.lock.json" \
              "$DIR/source-commits.txt" "$DIR/official-toolchain-status.txt"
            echo "Published matched ImageBuilder and SDK: $TAG"
          fi
          # workflow_dispatch is allowed to trigger another workflow using GITHUB_TOKEN.
          gh workflow run firmware-immortalwrt.yml -R "$GITHUB_REPOSITORY" \
            --ref main -f "builder_tag=$TAG"
          {
            echo "## Weekly/manual full source build completed"
            echo "Builder + SDK Release: $TAG"
            echo "SDK archive: $SDK_NAME"
            echo "SDK SHA256: $(jq -r '.archive_sha256' "$SDK_META")"
            echo "Source feed lock: sdk-feeds.lock.json"
            echo "Triggered firmware workflow using the built Builder."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report compilation cache efficiency
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            CCACHE_DIR="$GITHUB_WORKSPACE/.build-cache/ccache" ccache --show-stats || true
          fi
      - name: Upload compiled Builder, matched SDK and test image artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-compiled-builder
          path: out-immortal/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

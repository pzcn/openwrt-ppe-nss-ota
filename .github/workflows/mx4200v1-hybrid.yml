name: MX4200 v1 Hybrid - official Snapshot + local PPE NSS (test)

# Separate from Arthur. Only CI artifacts, never a Release/OTA.
on:
  push:
    branches: ["feat/mx4200v1-hybrid-builder"]
    paths:
      - "mx4200v1/**"
      - "scripts/resolve-immortalwrt-snapshot.py"
      - "scripts/reuse-official-toolchain.sh"
      - "scripts/hybrid_builder.py"
      - "scripts/hybrid-common.sh"
      - ".github/workflows/mx4200v1-hybrid.yml"
  pull_request:
    paths:
      - "mx4200v1/**"
      - "scripts/resolve-immortalwrt-snapshot.py"
      - "scripts/reuse-official-toolchain.sh"
      - "scripts/hybrid_builder.py"
      - "scripts/hybrid-common.sh"
      - ".github/workflows/mx4200v1-hybrid.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mx4200v1-hybrid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Validate MX4200 v1 and shared Hybrid contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check shell and Python syntax
        run: |
          set -Eeuo pipefail
          bash -n mx4200v1/build-hybrid.sh
          bash -n mx4200v1/build.sh
          bash -n mx4200v1/port-ppe-nss.sh
          bash -n scripts/reuse-official-toolchain.sh
          bash -n scripts/hybrid-common.sh
          python3 -m compileall -q mx4200v1 scripts
      - name: Run target-isolation and Hybrid regression tests
        run: |
          set -Eeuo pipefail
          python3 mx4200v1/test_contract.py
          python3 mx4200v1/test_hybrid_contract.py
          python3 scripts/tests/test-hybrid-snapshot.py
          python3 scripts/tests/test-hybrid-builder.py
          python3 scripts/tests/test-fit-configs.py

  hybrid:
    name: Build ipq807x PPE/NSS and test MX4200 v1 factory/sysupgrade
    if: github.event_name != 'pull_request'
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Freeze official ipq807x Snapshot metadata
        run: |
          set -Eeuo pipefail
          python3 scripts/resolve-immortalwrt-snapshot.py \
            --target qualcommax/ipq807x \
            --output out-mx4200v1-snapshot/snapshot-lock.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path("out-mx4200v1-snapshot/snapshot-lock.json").read_text())
          assert lock["target"] == "qualcommax/ipq807x"
          assert lock["architecture"] == "aarch64_cortex-a53"
          assert lock["compatibility"]["ppe_port_kernel_line_matches"]
          assert lock["assets"]["toolchain"]["filename"].startswith(
              "immortalwrt-toolchain-qualcommax-ipq807x")
          print("Official ipq807x Snapshot lock: validated")
          PY
      - name: Restore MX source downloads
        uses: actions/cache/restore@v4
        with:
          path: .build-cache/mx4200v1-hybrid/dl
          key: mx4200v1-hybrid-dl-v1-${{ github.run_id }}
          restore-keys: mx4200v1-hybrid-dl-v1-
      - name: Restore MX compiler objects
        uses: actions/cache/restore@v4
        with:
          path: .build-cache/mx4200v1-hybrid/ccache
          key: mx4200v1-hybrid-ccache-v1-${{ github.run_id }}
          restore-keys: mx4200v1-hybrid-ccache-v1-
      - name: Free unused disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h
      - name: Install ImmortalWrt build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison bzip2 ccache clang cmake cpio curl device-tree-compiler \
            file flex gawk gettext git gperf haveged help2man intltool jq \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libreadline-dev libssl-dev libtool \
            ninja-build p7zip-full patch pkgconf python3 python3-pip \
            python3-ply python3-pyelftools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo unzip wget xmlto xxd \
            zlib1g-dev zstd
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build MX-only Hybrid and factory/sysupgrade smoke
        env:
          SNAPSHOT_LOCK: ${{ github.workspace }}/out-mx4200v1-snapshot/snapshot-lock.json
        run: bash mx4200v1/build-hybrid.sh
      - name: Save downloaded sources after success or failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .build-cache/mx4200v1-hybrid/dl
          key: mx4200v1-hybrid-dl-v1-${{ github.run_id }}
      - name: Save compiler objects after success or failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .build-cache/mx4200v1-hybrid/ccache
          key: mx4200v1-hybrid-ccache-v1-${{ github.run_id }}
      - name: Upload MX4200 v1 firmware for MANUAL tests only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mx4200v1-hybrid-firmware-test
          path: |
            out-mx4200v1-hybrid/*-factory.bin
            out-mx4200v1-hybrid/*-sysupgrade.bin
            out-mx4200v1-hybrid/*.manifest
            out-mx4200v1-hybrid/sha256sums
            out-mx4200v1-hybrid/mx4200v1-hybrid-metadata.json
            out-mx4200v1-hybrid/source-commits.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload matching MX-only ImageBuilder and SDK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mx4200v1-hybrid-builder-sdk-test
          path: |
            out-mx4200v1-hybrid/*imagebuilder*.tar.zst
            out-mx4200v1-hybrid/*sdk*.tar.zst
            out-mx4200v1-hybrid/base-overlay.tar.gz
            out-mx4200v1-hybrid/snapshot-lock.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload diagnostic logs even when the build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mx4200v1-hybrid-diagnostics
          path: |
            out-mx4200v1-snapshot/snapshot-lock.json
            out-mx4200v1-hybrid/*.txt
            out-mx4200v1-hybrid/*.json
            out-mx4200v1-hybrid/*.log
            out-mx4200v1-hybrid/immortalwrt.config
          if-no-files-found: warn
          retention-days: 14

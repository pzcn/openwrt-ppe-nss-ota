name: Firmware from released ImmortalWrt ImageBuilder

on:
  workflow_call:
    inputs:
      builder_tag:
        type: string
        default: ""
      layer_tag:
        type: string
        default: ""
      force_firmware:
        type: boolean
        default: false
      publish_release:
        type: boolean
        default: false
      publish_policy:
        type: string
        default: "no"
      sing_box_pre_version:
        type: string
        default: ""
  pull_request:
    paths:
      - ".github/workflows/firmware-immortalwrt.yml"
      - ".github/workflows/builder-immortalwrt.yml"
      - "scripts/**"
      - "config/**"
      - "files/**"
  workflow_dispatch:
    inputs:
      builder_tag:
        description: "Optional specific published imm-builder-... tag (blank: newest)"
        type: string
        required: false
        default: ""
      layer_tag:
        description: "Optional imm-layer-... tag (blank: newest stable compatible layer, none: disable)"
        type: string
        required: false
        default: ""
      force_firmware:
        description: "Repack even when this source and Builder were already released"
        type: boolean
        required: false
        default: false
      sing_box_pre_version:
        description: "Optional pinned core 1.15.0-alpha.13 (testing only)"
        type: string
        required: false
        default: ""
      publish_release:
        description: "Publish the firmware Release after successful repack"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

# A Builder release may dispatch this workflow while a code-push build is queued.
# Serialize both so they cannot publish duplicate firmware at once.
concurrency:
  group: re-ss-01-firmware
  cancel-in-progress: false

jobs:
  validate:
    name: Offline checks (no image compilation)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check shell and Python syntax
        run: |
          for script in scripts/build-immortalwrt.sh scripts/repack-immortalwrt.sh scripts/rebuild-missing-apks.sh scripts/test-sdk-smoke.sh scripts/reuse-official-toolchain.sh scripts/apply-immortalwrt-compat.sh; do bash -n "$script"; done
          python3 -m compileall -q scripts
      - name: Validate plugins, LuCI, Dr.COM, OTA, Builder and eMMC patches
        run: |
          python3 scripts/tests/test-luci-i18n.py
          python3 scripts/tests/test-luci-native.py
          node scripts/tests/test-luci-autocheckboxes.js
          node scripts/tests/test-embedded-ota-render.js
          node scripts/tests/test-ota-proxy-ui.js
          node scripts/tests/test-ppe-nss-monitor.js
          python3 scripts/tests/test-ppe-nss-telemetry.py
          node scripts/tests/test-drcom-rpc.js
          python3 scripts/tests/test-drcom.py
          python3 scripts/tests/test-extra-apps.py
          python3 scripts/tests/test-immortalwrt-ota.py
          python3 scripts/tests/test-ota-github-proxy.py
          python3 scripts/tests/test-ota-devices.py
          python3 scripts/tests/test-luci-cache-identity.py
          python3 scripts/tests/test-sing-box-pre.py
          python3 scripts/tests/test-firmware-inputs.py
          python3 scripts/tests/test-hybrid-layer.py
          python3 scripts/tests/test-immortalwrt-builder.py
          python3 scripts/tests/test-immortalwrt-sdk.py
          python3 scripts/tests/test-immortalwrt-sdk-apks.py
          python3 scripts/tests/test-immortalwrt-compat.py
          python3 scripts/tests/test-exclude-drcom.py

  firmware:
    name: Resolve existing Builder and repack firmware
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH_RELEASE: ${{ github.ref == 'refs/heads/main' && (inputs.publish_policy == 'yes' || (inputs.publish_policy != 'no' && (github.event_name != 'workflow_dispatch' || inputs.publish_release))) }}
      SING_BOX_PRE_VERSION: ${{ inputs.sing_box_pre_version || '' }}
      RELEASE_PRERELEASE: ${{ inputs.publish_policy == 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - name: Find a published Builder and check if firmware changed
        id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.builder_tag || '' }}
          REQUESTED_LAYER: ${{ inputs.layer_tag || '' }}
          FORCE_FIRMWARE: ${{ inputs.force_firmware || false }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "$REQUESTED_TAG" ]]; then
            [[ "$REQUESTED_TAG" =~ ^imm-builder-[a-zA-Z0-9._-]+$ ]] || { echo "::error::Invalid Builder tag"; exit 1; }
            TAG="$REQUESTED_TAG"
          else
            TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("imm-builder-")))] | sort_by(.published_at) | last | .tag_name // empty')"
          fi
          if [[ -z "$TAG" ]]; then
            echo "needs_image=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No published ImageBuilder exists. Run the weekly/manual Builder workflow first."
            exit 0
          fi
          echo "builder_tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/imm-builder-download"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            -D "$RUNNER_TEMP/imm-builder-download" -p builder-metadata.json
          META="$RUNNER_TEMP/imm-builder-download/builder-metadata.json"
          # Firmware always consumes the latest published Builder. Release
          # metadata describes THAT compiled ABI, not today's Git recipe.
          # Check the release's own profile/tag/format; the following repack
          # job verifies SHA256 of the archive, overlay and package list.
          META_TAG="$(jq -er '.tag' "$META")"
          [[ "$META_TAG" == "$TAG" ]] || {
            echo "::error::Selected Builder release tag differs from its metadata."
            exit 1
          }
          python3 scripts/immortalwrt_builder.py check --metadata "$META"
          # A layer points to one immutable Builder and never replaces its SDK.
          LAYER=""
          if [[ "$REQUESTED_LAYER" != none ]]; then
            mkdir -p "$RUNNER_TEMP/imm-layer-candidates"
            if [[ -n "$REQUESTED_LAYER" ]]; then
              [[ "$REQUESTED_LAYER" =~ ^imm-layer-[0-9a-f]{24}$ ]] || {
                echo "::error::Invalid requested layer tag"; exit 1;
              }
              printf "%s\n" "$REQUESTED_LAYER" > "$RUNNER_TEMP/imm-layer-candidates/tags.txt"
            else
              gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
                [.[] | select(.draft == false and .prerelease == false and
                              (.tag_name | startswith("imm-layer-")) and
                              ((.name // "") | startswith("Hybrid Userland Layer")))]
                | sort_by(.published_at) | reverse | .[0:50][] | .tag_name
              ' > "$RUNNER_TEMP/imm-layer-candidates/tags.txt"
            fi
            while IFS= read -r candidate; do
              test -n "$candidate" || continue
              mkdir -p "$RUNNER_TEMP/imm-layer-candidates/$candidate"
              if gh release download "$candidate" -R "$GITHUB_REPOSITORY" \
                   -D "$RUNNER_TEMP/imm-layer-candidates/$candidate" \
                   -p layer-metadata.json >/dev/null 2>&1 &&
                 python3 scripts/hybrid_layer.py check-header \
                   --base-metadata "$META" \
                   --metadata "$RUNNER_TEMP/imm-layer-candidates/$candidate/layer-metadata.json" \
                   >/dev/null 2>&1; then
                LAYER="$candidate"
                break
              fi
            done < "$RUNNER_TEMP/imm-layer-candidates/tags.txt"
            if [[ -n "$REQUESTED_LAYER" && -z "$LAYER" ]]; then
              echo "::error::Requested layer is not compatible with Builder $TAG"
              exit 1
            fi
          fi
          echo "layer_tag=$LAYER" >> "$GITHUB_OUTPUT"
          echo "Selected layer: ${LAYER:-none}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$FORCE_FIRMWARE" != true ]]; then
            LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '[.[] | select(.draft == false and (.tag_name | startswith("imm-ppe-nss-")))] | sort_by(.published_at) | last | .tag_name // empty')"
            if [[ -n "$LATEST" ]]; then
              mkdir -p "$RUNNER_TEMP/imm-last-firmware"
              if gh release download "$LATEST" -R "$GITHUB_REPOSITORY" \
                -D "$RUNNER_TEMP/imm-last-firmware" -p ota.json >/dev/null 2>&1; then
                OLD_META="$RUNNER_TEMP/imm-last-firmware/ota.json"
                if jq -e --arg builder "$TAG" --arg layer "$LAYER" '.builder_tag == $builder and (.layer_tag // "") == $layer' "$OLD_META" >/dev/null; then
                  OLD_SOURCE="$(jq -r '.source_commit // empty' "$OLD_META")"
                  UNCHANGED=false
                  if [[ "$OLD_SOURCE" == "$GITHUB_SHA" ]]; then
                    UNCHANGED=true
                  elif [[ "$OLD_SOURCE" =~ ^[a-f0-9]{40}$ ]]; then
                    # If old commit is inaccessible or diff fails, conservatively repack.
                    if git cat-file -e "${OLD_SOURCE}^{commit}" 2>/dev/null ||
                       git fetch -q --depth 1 origin "$OLD_SOURCE"; then
                      if IMPACT="$(python3 scripts/firmware_inputs.py --base "$OLD_SOURCE" --head "$GITHUB_SHA")"; then
                        echo "$IMPACT"
                        if grep -Fxq 'changed=false' <<< "$IMPACT"; then
                          UNCHANGED=true
                        fi
                      else
                        echo "::warning::Cannot compare firmware inputs; repacking safely."
                      fi
                    else
                      echo "::warning::Previous firmware commit unavailable; repacking safely."
                    fi
                  fi
                  if [[ "$UNCHANGED" == true ]]; then
                    echo "needs_image=false" >> "$GITHUB_OUTPUT"
                    echo "## No new firmware" >> "$GITHUB_STEP_SUMMARY"
                    echo "Builder $TAG and RE-SS-01 firmware inputs are unchanged." >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                fi
              fi
            fi
          fi
          echo "needs_image=true" >> "$GITHUB_OUTPUT"
          echo "## Repack firmware" >> "$GITHUB_STEP_SUMMARY"
          echo "Builder: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Layer: ${LAYER:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Install ImageBuilder repack dependencies
        if: steps.resolve.outputs.needs_image == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd rsync jq python3 make
      - name: Setup Node.js for LuCI checks
        if: steps.resolve.outputs.needs_image == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reuse extra APKs already built by the same SDK
        if: steps.resolve.outputs.needs_image == 'true'
        uses: actions/cache@v4
        with:
          path: .build-cache/sdk-apks
          key: sdk-apks-v1-${{ steps.resolve.outputs.builder_tag }}-${{ hashFiles('config/add.txt', 'config/remove.txt') }}
      - name: Download exactly matching Builder assets
        if: steps.resolve.outputs.needs_image == 'true'
        env:
          BUILDER_TAG: ${{ steps.resolve.outputs.builder_tag }}
        run: |
          set -Eeuo pipefail
          gh release download "$BUILDER_TAG" -R "$GITHUB_REPOSITORY" \
            -D "$RUNNER_TEMP/imm-builder-download" \
            -p '*imagebuilder*.tar.zst' -p 'base-overlay.tar.gz' \
            -p 'imagebuilder-packages.txt' -p 'official-apks.json'
      - name: Download exact immutable userland APK layer (no duplicated IB/SDK)
        if: steps.resolve.outputs.needs_image == 'true' && steps.resolve.outputs.layer_tag != ''
        env:
          LAYER_TAG: ${{ steps.resolve.outputs.layer_tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/imm-layer-download"
          gh release download "$LAYER_TAG" -R "$GITHUB_REPOSITORY" \
            -D "$RUNNER_TEMP/imm-layer-download" \
            -p layer-metadata.json -p hybrid-userland-packages.tar.zst \
            -p official-apks.json -p imagebuilder-packages.txt -p snapshot-lock.json
      - name: Repack firmware (SDK compiles missing packages only)
        if: steps.resolve.outputs.needs_image == 'true'
        env:
          LAYER_TAG: ${{ steps.resolve.outputs.layer_tag }}
        run: |
          set -Eeuo pipefail
          DIR="$RUNNER_TEMP/imm-builder-download"
          ARCHIVE="$(find "$DIR" -maxdepth 1 -type f -name '*imagebuilder*.tar.zst' -print -quit)"
          test -n "$ARCHIVE"
          if [[ -n "$LAYER_TAG" ]]; then
            LAYER_DIR="$RUNNER_TEMP/imm-layer-download"
            export HYBRID_LAYER_META="$LAYER_DIR/layer-metadata.json"
            export HYBRID_LAYER_ARCHIVE="$LAYER_DIR/hybrid-userland-packages.tar.zst"
            export HYBRID_LAYER_OFFICIAL="$LAYER_DIR/official-apks.json"
            export HYBRID_LAYER_PACKAGES="$LAYER_DIR/imagebuilder-packages.txt"
            export HYBRID_LAYER_SNAPSHOT="$LAYER_DIR/snapshot-lock.json"
            export HYBRID_PARENT_OFFICIAL="$DIR/official-apks.json"
          fi
          BUILDER_META="$DIR/builder-metadata.json" \
          BUILDER_ARCHIVE="$ARCHIVE" \
          BASE_OVERLAY="$DIR/base-overlay.tar.gz" \
          BUILDER_PACKAGES="$DIR/imagebuilder-packages.txt" \
          bash scripts/repack-immortalwrt.sh
      - name: Upload repacked firmware for inspection
        if: steps.resolve.outputs.needs_image == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-repacked-firmware
          path: out-immortal/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
